<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Segoe UI,Arial;background:#f1f5f9;color:#0f172a}
.wrap{display:flex;gap:28px;padding:28px}
.col{background:#fff;border-radius:18px;padding:22px;width:380px;box-shadow:0 2px 8px #0001;text-align:center}
h2{margin:0 0 4px;font-size:22px} p{margin:0 0 16px;color:#64748b;font-size:14px;min-height:40px}
.big{width:260px;height:260px}
.row{display:flex;justify-content:center;gap:18px;align-items:flex-end;margin-top:16px}
.round{width:96px;height:96px;border-radius:50%;overflow:hidden}
.round img{width:96px;height:96px}
.home{background:#334155;border-radius:16px;padding:14px;margin-top:16px;display:flex;justify-content:center;gap:22px}
.app{display:flex;flex-direction:column;align-items:center;color:#fff;font-size:12px;gap:6px}
.app img{width:56px;height:56px;border-radius:14px}
</style></head><body><div class="wrap">
<div class="col"><h2>A · Nhà + khung quét</h2><p>Xanh dương. Ngôi nhà có người ở, khung quét 4 góc như lúc quét CCCD.</p>
<img class="big" src="a-nha-quet.svg"><div class="row"><div class="round"><img src="a-nha-quet.svg"></div><img src="a-nha-quet.svg" width="48"><img src="a-nha-quet.svg" width="32"></div>
<div class="home"><div class="app"><img src="a-nha-quet.svg">Lưu trú</div></div></div>
<div class="col"><h2>B · Khiên + nhà</h2><p>Xanh lục đậm. Khiên bảo vệ (an ninh) ôm ngôi nhà vàng.</p>
<img class="big" src="b-khien-nha.svg"><div class="row"><div class="round"><img src="b-khien-nha.svg"></div><img src="b-khien-nha.svg" width="48"><img src="b-khien-nha.svg" width="32"></div>
<div class="home"><div class="app"><img src="b-khien-nha.svg">Lưu trú</div></div></div>
<div class="col"><h2>C · Thẻ CCCD + tích</h2><p>Đỏ. Thẻ căn cước có mã QR và dấu tích "đã khai báo".</p>
<img class="big" src="c-the-cccd.svg"><div class="row"><div class="round"><img src="c-the-cccd.svg"></div><img src="c-the-cccd.svg" width="48"><img src="c-the-cccd.svg" width="32"></div>
<div class="home"><div class="app"><img src="c-the-cccd.svg">Lưu trú</div></div></div>
</div></body></html>
